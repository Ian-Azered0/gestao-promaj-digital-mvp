<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão PROMAJ Digital | Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand-lockup">
        <div class="brand-mark" aria-hidden="true">P</div>
        <div>
          <span class="brand-kicker">Teresópolis</span>
          <h1 id="login-title">Gestão PROMAJ Digital</h1>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">E-mail institucional</label>
          <input type="email" class="form-control form-control-lg" id="email" autocomplete="username" placeholder="nome@teresopolis.rj.gov.br" required>
          <div class="invalid-feedback">Informe um e-mail válido.</div>
        </div>
        <div class="mb-3">
          <label for="senha" class="form-label">Senha</label>
          <input type="password" class="form-control form-control-lg" id="senha" autocomplete="current-password" minlength="6" required>
          <div class="invalid-feedback">A senha deve ter pelo menos 6 caracteres.</div>
        </div>
        <fieldset class="mb-4">
          <legend class="form-label">Entrar como</legend>
          <div class="role-options">
            <label class="role-option">
              <input type="radio" name="perfil" value="tutor" checked>
              <span><strong>Tutor</strong><small>Lançar frequência</small></span>
            </label>
            <label class="role-option">
              <input type="radio" name="perfil" value="coordenador">
              <span><strong>Coordenador</strong><small>Conferir e fechar</small></span>
            </label>
          </div>
        </fieldset>
        <button type="submit" class="btn btn-primary btn-lg w-100">Entrar no sistema</button>
      </form>
    </section>
  </main>
  <script src="assets/js/app.js"></script>
</body>
</html>
